################################################################################
# CharityChain — Nginx Production Configuration
# Phase 14: TLS termination, rate limiting, reverse proxy
################################################################################

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers (applied to all responses)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Hide nginx version
    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=static:10m rate=200r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --- Redirect HTTP to HTTPS ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- Frontend (Next.js) ---
    server {
        listen 443 ssl http2;
        server_name charitychain.dev www.charitychain.dev;

        ssl_certificate /etc/nginx/certs/charitychain.dev.crt;
        ssl_certificate_key /etc/nginx/certs/charitychain.dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        limit_conn conn_limit 50;

        location / {
            limit_req zone=static burst=50 nodelay;
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }
    }

    # --- Backend API ---
    server {
        listen 443 ssl http2;
        server_name api.charitychain.dev;

        ssl_certificate /etc/nginx/certs/api.charitychain.dev.crt;
        ssl_certificate_key /etc/nginx/certs/api.charitychain.dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        limit_conn conn_limit 100;

        # Stricter rate limit for auth endpoints
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Standard API rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # Allow AI processing time
            client_max_body_size 50M;  # Evidence file uploads
        }

        # Public JWKS endpoint (unauthenticated, cached)
        location /.well-known/ {
            proxy_pass http://backend:8000;
            proxy_cache_valid 200 1h;
        }

        # Block direct Prometheus access from internet
        location /metrics {
            deny all;
        }
    }

    # --- Grafana (internal only — requires VPN or SSH tunnel in production) ---
    server {
        listen 443 ssl http2;
        server_name grafana.charitychain.dev;

        ssl_certificate /etc/nginx/certs/grafana.charitychain.dev.crt;
        ssl_certificate_key /etc/nginx/certs/grafana.charitychain.dev.key;

        # Restrict to internal IPs (replace with your VPN/office IP range)
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

