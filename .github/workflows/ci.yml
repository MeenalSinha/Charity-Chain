name: CI — Continuous Integration

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ============================================================
  # Backend: Lint, Type Check, Test
  # ============================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint check
        run: |
          pip install ruff
          ruff check backend/app/core/startup_checks.py || true

      - name: Run tests
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///./ci_test.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-at-least-64-hex-chars-for-ci-testing-00000000000000
          JWT_SECRET_KEY: test-jwt-key-at-least-64-hex-chars-for-ci-testing-000000000000000
          ENCRYPTION_KEY: ""
          PAYPAL_ENVIRONMENT: sandbox
          SENTRY_DSN: ""
          DEBUG: "false"
        run: |
          mkdir -p test-results
          pytest tests/ -v --tb=short --junit-xml=test-results/backend.xml \
            --ignore=tests/smoke \
            -q

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/

  # ============================================================
  # Frontend: Type Check, Test, Build
  # ============================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm run type-check

      - name: Run Vitest
        run: |
          mkdir -p ../test-results
          pnpm test -- --reporter=junit --outputFile=../test-results/frontend.xml

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: pnpm run build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: test-results/

  # ============================================================
  # Security: Bandit SAST, pip-audit dependency scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit SAST scan
        run: |
          bandit -r backend/app/ \
            -x backend/app/tests/ \
            -ll \
            --format json \
            --output bandit-report.json || true
          bandit -r backend/app/ -x backend/app/tests/ -ll || true

      - name: pip-audit dependency scan
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            bandit-report.json
            pip-audit-report.json

  # ============================================================
  # Docker: Build validation
  # ============================================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: charitychain-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: charitychain-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
