version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: charitychain_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-charity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charity_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-charitychain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-charity_user} -d ${POSTGRES_DB:-charitychain}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: charitychain_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: charitychain_backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-charity_user}:${POSTGRES_PASSWORD:-charity_secure_password}@postgres:5432/${POSTGRES_DB:-charitychain}
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

